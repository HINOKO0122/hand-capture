<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Drawing Fullscreen</title>
  
  <!-- MediaPipe / TensorFlow.js 関連ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #121212;
      font-family: sans-serif;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* 画面全体に広げて左右反転 */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* キャンバスは背景透過 */
    #drawCanvas {
      pointer-events: none;
    }

    /* UIレイアウト（画面上部に浮遊表示） */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.65);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      color: white;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #ff3b30;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #d72c21;
    }

    #status {
      font-size: 14px;
    }

    /* ペンが着地している（書ける）状態インジケーター */
    #depth-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #666;
      margin-left: 8px;
    }
    #depth-indicator.active {
      background-color: #00ffcc;
      box-shadow: 0 0 10px #00ffcc;
    }
  </style>
</head>
<body>

  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="drawCanvas"></canvas>
  </div>

  <div id="ui">
    <button id="clearBtn">画面をクリア</button>
    <div style="display: flex; align-items: center;">
      <span id="status">AIモデルを読み込んでいます...</span>
      <span id="depth-indicator"></span>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');
    const statusText = document.getElementById('status');
    const depthIndicator = document.getElementById('depth-indicator');

    let detector = null;
    let isDrawing = false;
    let lastPoint = null;

    // 画面サイズのリサイズ処理
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      // リサイズ時に線のスタイルを設定し直す
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. カメラ設定
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve(video);
      });
    }

    // 2. Hand Detector 初期化
    async function setupDetector() {
      const model = handPoseDetection.SupportedModels.MediaPipeHands;
      const detectorConfig = {
        runtime: 'mediapipe',
        solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands',
        modelType: 'full'
      };
      detector = await handPoseDetection.createDetector(model, detectorConfig);
      statusText.textContent = '準備完了：人差し指だけを立て、手前に押し出すと描画できます';
    }

    // 指が1本（人差し指）だけ伸びているか判定
    function isOnlyIndexExtended(keypoints) {
      const getPt = (name) => keypoints.find(k => k.name === name);

      const wrist = getPt('wrist');
      const indexTip = getPt('index_finger_tip');
      const indexMcp = getPt('index_finger_mcp');
      const middleTip = getPt('middle_finger_tip');
      const middleMcp = getPt('middle_finger_mcp');
      const ringTip = getPt('ring_finger_tip');
      const ringMcp = getPt('ring_finger_mcp');
      const pinkyTip = getPt('pinky_finger_tip');
      const pinkyMcp = getPt('pinky_finger_mcp');

      // 手首からの距離で、指が伸ばされているかを判定
      const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

      const indexExtended = dist(indexTip, wrist) > dist(indexMcp, wrist) * 1.2;
      const middleFolded = dist(middleTip, wrist) < dist(middleMcp, wrist) * 1.1;
      const ringFolded = dist(ringTip, wrist) < dist(ringMcp, wrist) * 1.1;
      const pinkyFolded = dist(pinkyTip, wrist) < dist(pinkyMcp, wrist) * 1.1;

      return indexExtended && middleFolded && ringFolded && pinkyFolded;
    }

    // 3. ループ処理
    async function renderLoop() {
      if (detector && video.readyState >= 2) {
        const hands = await detector.estimateHands(video);

        if (hands.length > 0) {
          const keypoints = hands[0].keypoints;
          const indexTip = keypoints.find(k => k.name === 'index_finger_tip');

          // 【条件1】人差し指だけが伸びているか
          const validGesture = isOnlyIndexExtended(keypoints);

          // 【条件2】Z軸（またはカメラ画像上の手の大きさ）による深さ判定
          // 手が前に押し出されている（カメラに近づいている＝描画）かどうか
          // ※ MediaPipeのZ座標、または手の関節間距離で画面への近さを判定できます
          const wrist = keypoints.find(k => k.name === 'wrist');
          const indexMcp = keypoints.find(k => k.name === 'index_finger_mcp');
          const handSize = Math.hypot(wrist.x - indexMcp.x, wrist.y - indexMcp.y);

          // 画面に手を近づけると handSize が大きくなる
          // カメラからの距離閾値（環境に合わせて手を前へ押し出すと描画モードになる）
          const isPenPressed = handSize > 80; 

          if (validGesture && isPenPressed) {
            depthIndicator.classList.add('active');

            // video の表示サイズと canvas の実際の描画座標の倍率補正
            const scaleX = canvas.width / video.videoWidth;
            const scaleY = canvas.height / video.videoHeight;
            
            const currentPoint = {
              x: indexTip.x * scaleX,
              y: indexTip.y * scaleY
            };

            if (!isDrawing) {
              isDrawing = true;
              lastPoint = currentPoint;
            } else {
              ctx.beginPath();
              ctx.moveTo(lastPoint.x, lastPoint.y);
              ctx.lineTo(currentPoint.x, currentPoint.y);
              ctx.stroke();
              lastPoint = currentPoint;
            }
          } else {
            depthIndicator.classList.remove('active');
            isDrawing = false;
            lastPoint = null;
          }
        } else {
          depthIndicator.classList.remove('active');
          isDrawing = false;
          lastPoint = null;
        }
      }
      requestAnimationFrame(renderLoop);
    }

    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    async function main() {
      try {
        await setupCamera();
        await setupDetector();
        renderLoop();
      } catch (err) {
        console.error(err);
        statusText.textContent = 'エラー: カメラアクセスを許可してください';
      }
    }

    main();
  </script>
</body>
</html>
